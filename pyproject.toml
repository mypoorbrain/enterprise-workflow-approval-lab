[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-workflow-approval-lab"
version = "0.1.0"
description = "Synthetic enterprise workflow delivery showcase with conditional approvals, SLA visibility, readiness gates, audit trail, and generated artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Uzoh Obialeri" }]
keywords = [
  "digital-transformation",
  "workflow",
  "approval",
  "audit",
  "governance",
  "program-management"
]

[project.scripts]
enterprise-workflow-lab = "enterprise_workflow_lab.cli:main"
